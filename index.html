<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>妞妞的小花园</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script>
<style>
:root{--bg:#f6f8f3;--card:#ffffff;--text:#233126;--muted:#788278;--green:#dff0df;--greenText:#24512a;--red:#f5dddd;--redText:#7b2929;--line:#e7ebe5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text)}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}.hero,.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:22px}.hero{padding:20px;margin-bottom:14px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:26px;font-weight:800}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#aaa;margin-right:6px}.dot.ok{background:#52a35c}.dot.bad{background:#c95a5a}.statusline{font-size:13px;color:var(--muted);white-space:nowrap}.cute{margin-top:6px;color:var(--muted);font-size:14px}.moisture{font-size:68px;font-weight:800;line-height:1;margin-top:20px}.smalllabel{font-size:13px;color:var(--muted);margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.card{padding:16px}.card .value{font-size:20px;font-weight:750;margin-top:5px}.panel{padding:17px}button{width:100%;min-height:52px;border:0;border-radius:14px;margin-top:10px;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}.water{background:var(--green);color:var(--greenText)}.stop{background:var(--red);color:var(--redText)}.normal{background:#e9ecef;color:#303630}.test{background:#f3ead7;color:#6b5423}.msg{margin-top:14px;min-height:24px;color:#627062;font-size:14px;line-height:1.5}.meta{margin-top:8px;color:#8d958d;font-size:12px;line-height:1.7}.login{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}input[type=password]{width:100%;min-height:46px;padding:10px 12px;border:1px solid #ccd4cc;border-radius:12px;font-size:16px;background:#fff}.row{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;color:var(--muted)}.row input{width:18px;height:18px}.hidden{display:none!important}.note{margin-top:12px;font-size:12px;color:#8d958d;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="topline"><div class="title">🌱 妞妞的小花园</div><div class="statusline"><span id="cloudDot" class="dot bad"></span><span id="cloudText">未连接</span></div></div>
<div id="cute" class="cute">妞妞正在等你连接云端～</div><div id="moisture" class="moisture">--%</div><div class="smalllabel">当前土壤湿度</div>
<div id="loginBox" class="login"><label for="mqttPassword">MQTT 控制端密码（niuniu_app）</label><input id="mqttPassword" type="password" autocomplete="current-password" placeholder="请输入 niuniu_app 密码"><div class="row"><input id="rememberPwd" type="checkbox"><span>仅保存在这台浏览器中</span></div><button id="connectBtn" class="water">☁️ 连接妞妞云端</button><div class="note">页面不会内置你的 MQTT 密码。勾选后，密码只保存在当前浏览器本地存储。</div></div>
</section>
<section class="grid"><div class="card"><div class="smalllabel">运行状态</div><div id="state" class="value">--</div></div><div class="card"><div class="smalllabel">今日浇水</div><div id="daily" class="value">-- / 3</div></div><div class="card"><div class="smalllabel">自动模式</div><div id="auto" class="value">--</div></div><div class="card"><div class="smalllabel">设备状态</div><div id="device" class="value">--</div></div></section>
<section class="panel"><div class="smalllabel">妞妞控制台</div><button id="waterBtn" class="water" disabled>💧 给小花喝水</button><button id="stopBtn" class="stop" disabled>■ 立即停止</button><button id="autoBtn" class="normal" disabled>自动浇水</button><button id="statusBtn" class="normal" disabled>↻ 立即刷新状态</button><button id="resetBtn" class="test hidden" disabled>🧪 TEST：清零今日次数</button><div id="msg" class="msg">尚未连接 EMQX Cloud。</div><div id="meta" class="meta"></div></section>
</div>
<script>
(()=>{const BROKER="wss://i4b43111.ala.cn-shenzhen.emqxsl.cn:8084/mqtt",USERNAME="niuniu_app",STATUS_TOPIC="niuniu/status",COMMAND_TOPIC="niuniu/command";let client=null,last=null,connected=false;const $=id=>document.getElementById(id),cloudDot=$("cloudDot"),cloudText=$("cloudText"),cuteEl=$("cute"),moistureEl=$("moisture"),stateEl=$("state"),dailyEl=$("daily"),autoEl=$("auto"),deviceEl=$("device"),msgEl=$("msg"),metaEl=$("meta"),passwordEl=$("mqttPassword"),rememberEl=$("rememberPwd"),connectBtn=$("connectBtn"),loginBox=$("loginBox"),waterBtn=$("waterBtn"),stopBtn=$("stopBtn"),autoBtn=$("autoBtn"),statusBtn=$("statusBtn"),resetBtn=$("resetBtn");const saved=localStorage.getItem("niuniu_mqtt_password");if(saved){passwordEl.value=saved;rememberEl.checked=true}function stateText(s){if(s==="monitoring")return"正常监测";if(s==="pumping")return"正在浇水";if(s==="soaking")return"等待渗透";if(s==="locked")return"今日闭锁";if(s==="sensor_fault")return"传感器异常";if(s==="offline")return"离线";return s||"--"}function cuteText(d){if(!d||d.online===false)return"妞妞暂时离线了";if(d.state==="pumping")return"妞妞正在认真浇水 💧";if(d.state==="soaking")return"妞妞在等水慢慢渗进土里…";if(d.state==="locked")return"今天已经浇够啦，妞妞休息～";if(d.state==="sensor_fault")return"妞妞找不到土壤传感器啦";if(!d.auto)return"自动浇水暂时休息中";if(Number(d.moisture)<=35)return"妞妞有一点口渴啦";return"妞妞和小花状态都不错"}function setCloud(ok,text){connected=ok;cloudDot.className="dot "+(ok?"ok":"bad");cloudText.textContent=text;stopBtn.disabled=!ok;statusBtn.disabled=!ok;updateControls()}function updateControls(){const d=last,usable=connected&&d&&d.online!==false,interval=d?Number(d.intervalRemaining||0):0,max=d?Number(d.maxDaily||3):3,daily=d?Number(d.daily||0):0,state=d?d.state:"";waterBtn.disabled=!usable||!d.sensorValid||daily>=max||state==="pumping"||state==="soaking"||interval>0;autoBtn.disabled=!usable;resetBtn.disabled=!usable}function render(d){last=d;moistureEl.textContent=d.sensorValid?`${d.moisture}%`:"--%";stateEl.textContent=stateText(d.state);dailyEl.textContent=`${d.daily??"--"} / ${d.maxDaily??3}`;autoEl.textContent=d.auto?"开启":"关闭";deviceEl.textContent=d.online===false?"离线":"在线";cuteEl.textContent=cuteText(d);autoBtn.textContent=d.auto?"关闭自动浇水":"开启自动浇水";resetBtn.classList.toggle("hidden",!d.test);const items=[];if(d.raw!==undefined)items.push(`RAW ${d.raw}`);if(d.intervalRemaining!==undefined)items.push(`间隔剩余 ${d.intervalRemaining}s`);if(d.countdown!==undefined&&Number(d.countdown)>0)items.push(`倒计时 ${d.countdown}s`);if(d.ip)items.push(`家中 IP ${d.ip}`);metaEl.textContent=items.join(" ｜ ");msgEl.textContent="状态已从 EMQX Cloud 更新";updateControls()}function publish(cmd){if(!client||!connected){msgEl.textContent="云端未连接。";return}client.publish(COMMAND_TOPIC,cmd,{qos:0,retain:false},err=>{msgEl.textContent=err?`命令发送失败：${err.message}`:`已发送：${cmd}`})}function connectCloud(){const pwd=passwordEl.value.trim();if(!pwd){msgEl.textContent="请先输入 niuniu_app 的 MQTT 密码。";return}if(rememberEl.checked)localStorage.setItem("niuniu_mqtt_password",pwd);else localStorage.removeItem("niuniu_mqtt_password");if(client){try{client.end(true)}catch(e){}client=null}setCloud(false,"连接中…");msgEl.textContent="正在连接 EMQX Cloud…";connectBtn.disabled=true;const clientId="niuniu-web-"+Math.random().toString(16).slice(2,10);client=mqtt.connect(BROKER,{username:USERNAME,password:pwd,clientId,clean:true,reconnectPeriod:3000,connectTimeout:10000,protocolVersion:4,keepalive:60});client.on("connect",()=>{setCloud(true,"CLOUD+");connectBtn.disabled=false;loginBox.classList.add("hidden");msgEl.textContent="云端连接成功，正在订阅妞妞状态…";client.subscribe(STATUS_TOPIC,{qos:0},err=>{if(err)msgEl.textContent="订阅状态主题失败："+err.message;else{msgEl.textContent="已连接，等待妞妞状态…";publish("status")}})});client.on("message",(topic,payload)=>{if(topic!==STATUS_TOPIC)return;try{render(JSON.parse(payload.toString()))}catch(e){msgEl.textContent="收到状态，但JSON解析失败。"}});client.on("reconnect",()=>{setCloud(false,"重连中…");msgEl.textContent="云端连接中断，正在自动重连…"});client.on("offline",()=>{setCloud(false,"CLOUD-");msgEl.textContent="当前无法连接云端。"});client.on("close",()=>setCloud(false,"CLOUD-"));client.on("error",err=>{setCloud(false,"连接失败");connectBtn.disabled=false;loginBox.classList.remove("hidden");msgEl.textContent="连接失败，请检查 MQTT 密码和网络。";console.error(err)})}connectBtn.addEventListener("click",connectCloud);waterBtn.addEventListener("click",()=>{if(confirm("确认让妞妞执行一次浇水吗？"))publish("water")});stopBtn.addEventListener("click",()=>publish("stop"));autoBtn.addEventListener("click",()=>{if(last)publish(last.auto?"auto_off":"auto_on")});statusBtn.addEventListener("click",()=>publish("status"));resetBtn.addEventListener("click",()=>{if(confirm("仅用于 TEST 模式：确认清零今日浇水次数？"))publish("test_reset")})})();
</script>
</body>
</html>
