<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>妞妞的小花园</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#f5f7f3;
  --card:#ffffff;
  --text:#243125;
  --muted:#7b857c;
  --line:#e7ebe5;
  --ok:#dff0df;
  --okText:#24512a;
  --danger:#f5dddd;
  --dangerText:#7a2b2b;
  --neutral:#e9ecef;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
.app{
  height:100dvh;
  max-width:520px;
  margin:0 auto;
  padding:
    max(8px, env(safe-area-inset-top))
    10px
    max(8px, env(safe-area-inset-bottom));
  display:grid;
  grid-template-rows:auto auto 1fr;
  gap:8px;
}
.hero,.mini,.controls{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
}
.hero{
  padding:12px 14px 11px;
}
.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.title{
  font-size:clamp(19px,5vw,24px);
  line-height:1.05;
  font-weight:800;
  white-space:nowrap;
}
.cloud{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}
.dot{
  display:inline-block;
  width:9px;height:9px;border-radius:50%;
  margin-right:5px;
  background:#c65c5c;
}
.dot.ok{background:#55a760}
.cute{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.hero-main{
  margin-top:5px;
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
}
.moisture{
  font-size:clamp(42px,13vw,58px);
  line-height:.95;
  font-weight:850;
  letter-spacing:-2px;
}
.moisture-label{
  margin-top:3px;
  font-size:11px;
  color:var(--muted);
}
.quick{
  text-align:right;
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
}
.login{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--line);
}
.login-row{
  display:grid;
  grid-template-columns:1fr 105px;
  gap:7px;
}
input[type=password]{
  width:100%;
  height:40px;
  border:1px solid #cbd3cb;
  border-radius:11px;
  padding:0 10px;
  font-size:16px;
  min-width:0;
}
.remember{
  margin-top:6px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--muted);
}
.remember input{width:16px;height:16px}
.status-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}
.mini{
  min-width:0;
  padding:9px 6px 8px;
  text-align:center;
}
.mini .k{
  color:var(--muted);
  font-size:10px;
  line-height:1.1;
}
.mini .v{
  margin-top:4px;
  font-size:clamp(13px,3.8vw,17px);
  font-weight:750;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.controls{
  min-height:0;
  padding:10px;
  display:grid;
  grid-template-rows:auto auto 1fr auto;
  gap:7px;
}
.section-title{
  font-size:11px;
  color:var(--muted);
}
.button-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
button{
  width:100%;
  height:46px;
  border:0;
  border-radius:13px;
  font-size:14px;
  font-weight:750;
  padding:0 8px;
  cursor:pointer;
}
button:disabled{opacity:.4;cursor:not-allowed}
.water{background:var(--ok);color:var(--okText)}
.stop{background:var(--danger);color:var(--dangerText)}
.normal{background:var(--neutral);color:#333}
.test{background:#f2ead6;color:#66501f}
.message-wrap{
  min-height:0;
  border-top:1px solid var(--line);
  padding-top:7px;
  overflow:hidden;
}
.msg{
  font-size:12px;
  color:#5f6b60;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.meta{
  margin-top:4px;
  color:#929992;
  font-size:10px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.footer{
  font-size:9px;
  color:#a0a6a0;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.hidden{display:none!important}

/* iPhone 16 Pro 竖屏（约393×852 CSS px）及更矮屏幕进一步压缩 */
@media (max-height:760px){
  .app{gap:6px;padding-top:max(5px,env(safe-area-inset-top));padding-bottom:max(5px,env(safe-area-inset-bottom))}
  .hero{padding:9px 11px 8px}
  .moisture{font-size:40px}
  .mini{padding:7px 4px}
  .controls{padding:8px;gap:5px}
  button{height:42px;font-size:13px}
  .msg{font-size:11px}
  .meta{font-size:9px}
}
</style>
</head>
<body>
<main class="app">

  <section class="hero">
    <div class="head">
      <div class="title">🌱 妞妞的小花园</div>
      <div class="cloud"><span id="cloudDot" class="dot"></span><span id="cloudText">未连接</span></div>
    </div>

    <div id="cute" class="cute">妞妞正在等你连接云端～</div>

    <div class="hero-main">
      <div>
        <div id="moisture" class="moisture">--%</div>
        <div class="moisture-label">当前土壤湿度</div>
      </div>
      <div id="quick" class="quick">设备 --<br>自动 --</div>
    </div>

    <div id="loginBox" class="login">
      <div class="login-row">
        <input id="mqttPassword" type="password" autocomplete="current-password" placeholder="niuniu_app 密码">
        <button id="connectBtn" class="water">连接云端</button>
      </div>
      <label class="remember"><input id="rememberPwd" type="checkbox">仅保存在这台浏览器中</label>
    </div>
  </section>

  <section class="status-grid">
    <div class="mini"><div class="k">状态</div><div id="state" class="v">--</div></div>
    <div class="mini"><div class="k">今日</div><div id="daily" class="v">--/3</div></div>
    <div class="mini"><div class="k">自动</div><div id="auto" class="v">--</div></div>
    <div class="mini"><div class="k">设备</div><div id="device" class="v">--</div></div>
  </section>

  <section class="controls">
    <div class="section-title">妞妞控制台</div>

    <div class="button-grid">
      <button id="waterBtn" class="water" disabled>💧 浇水一次</button>
      <button id="stopBtn" class="stop" disabled>■ 立即停止</button>
      <button id="autoBtn" class="normal" disabled>自动浇水</button>
      <button id="statusBtn" class="normal" disabled>↻ 刷新状态</button>
      <button id="resetBtn" class="test hidden" disabled>🧪 清零次数</button>
    </div>

    <div class="message-wrap">
      <div id="msg" class="msg">尚未连接 EMQX Cloud。</div>
      <div id="meta" class="meta"></div>
    </div>

    <div class="footer">Niuniu Watering · MQTT over WSS</div>
  </section>

</main>

<script>
(() => {
  const BROKER = "wss://i4b43111.ala.cn-shenzhen.emqxsl.cn:8084/mqtt";
  const USERNAME = "niuniu_app";
  const STATUS_TOPIC = "niuniu/status";
  const COMMAND_TOPIC = "niuniu/command";

  let client = null;
  let last = null;
  let connected = false;

  const $ = id => document.getElementById(id);
  const cloudDot = $("cloudDot"), cloudText = $("cloudText");
  const cuteEl = $("cute"), moistureEl = $("moisture"), quickEl = $("quick");
  const stateEl = $("state"), dailyEl = $("daily"), autoEl = $("auto"), deviceEl = $("device");
  const msgEl = $("msg"), metaEl = $("meta");
  const passwordEl = $("mqttPassword"), rememberEl = $("rememberPwd"), connectBtn = $("connectBtn"), loginBox = $("loginBox");
  const waterBtn = $("waterBtn"), stopBtn = $("stopBtn"), autoBtn = $("autoBtn"), statusBtn = $("statusBtn"), resetBtn = $("resetBtn");

  const saved = localStorage.getItem("niuniu_mqtt_password");
  if (saved) {
    passwordEl.value = saved;
    rememberEl.checked = true;
  }

  function stateText(s){
    if(s==="monitoring") return "监测";
    if(s==="pumping") return "浇水";
    if(s==="soaking") return "渗透";
    if(s==="locked") return "闭锁";
    if(s==="sensor_fault") return "故障";
    if(s==="offline") return "离线";
    return s || "--";
  }

  function cuteText(d){
    if(!d || d.online === false) return "妞妞暂时离线了";
    if(d.state==="pumping") return "妞妞正在认真浇水 💧";
    if(d.state==="soaking") return "妞妞在等水慢慢渗进土里…";
    if(d.state==="locked") return "今天已经浇够啦，妞妞休息～";
    if(d.state==="sensor_fault") return "妞妞找不到土壤传感器啦";
    if(!d.auto) return "自动浇水暂时休息中";
    if(Number(d.moisture) <= 35) return "妞妞有一点口渴啦";
    return "妞妞和小花状态都不错";
  }

  function setCloud(ok, text){
    connected = ok;
    cloudDot.className = "dot" + (ok ? " ok" : "");
    cloudText.textContent = text;
    stopBtn.disabled = !ok;
    statusBtn.disabled = !ok;
    updateControls();
  }

  function updateControls(){
    const d = last;
    const usable = connected && d && d.online !== false;
    const interval = d ? Number(d.intervalRemaining || 0) : 0;
    const max = d ? Number(d.maxDaily || 3) : 3;
    const daily = d ? Number(d.daily || 0) : 0;
    const state = d ? d.state : "";

    waterBtn.disabled = !usable || !d.sensorValid || daily >= max ||
      state === "pumping" || state === "soaking" || interval > 0;

    autoBtn.disabled = !usable;
    resetBtn.disabled = !usable;
  }

  function render(d){
    last = d;
    moistureEl.textContent = d.sensorValid ? `${d.moisture}%` : "--%";
    stateEl.textContent = stateText(d.state);
    dailyEl.textContent = `${d.daily ?? "--"}/${d.maxDaily ?? 3}`;
    autoEl.textContent = d.auto ? "开启" : "关闭";
    deviceEl.textContent = d.online === false ? "离线" : "在线";
    cuteEl.textContent = cuteText(d);
    quickEl.innerHTML = `设备 ${d.online === false ? "离线" : "在线"}<br>自动 ${d.auto ? "开启" : "关闭"}`;
    autoBtn.textContent = d.auto ? "关闭自动" : "开启自动";
    resetBtn.classList.toggle("hidden", !d.test);

    const items = [];
    if(d.raw !== undefined) items.push(`RAW ${d.raw}`);
    if(d.intervalRemaining !== undefined) items.push(`间隔 ${d.intervalRemaining}s`);
    if(d.countdown !== undefined && Number(d.countdown)>0) items.push(`倒计时 ${d.countdown}s`);
    if(d.ip) items.push(`IP ${d.ip}`);
    metaEl.textContent = items.join(" ｜ ");
    msgEl.textContent = "状态已从 EMQX Cloud 更新";
    updateControls();
  }

  function publish(cmd){
    if(!client || !connected){
      msgEl.textContent = "云端未连接。";
      return;
    }
    client.publish(COMMAND_TOPIC, cmd, {qos:0, retain:false}, err => {
      msgEl.textContent = err ? `命令失败：${err.message}` : `已发送：${cmd}`;
    });
  }

  function connectCloud(){
    const pwd = passwordEl.value.trim();
    if(!pwd){
      msgEl.textContent = "请输入 niuniu_app 的 MQTT 密码。";
      return;
    }

    if(rememberEl.checked) localStorage.setItem("niuniu_mqtt_password", pwd);
    else localStorage.removeItem("niuniu_mqtt_password");

    if(client){
      try{ client.end(true); }catch(e){}
      client = null;
    }

    setCloud(false, "连接中…");
    msgEl.textContent = "正在连接 EMQX Cloud…";
    connectBtn.disabled = true;

    client = mqtt.connect(BROKER, {
      username: USERNAME,
      password: pwd,
      clientId: "niuniu-web-" + Math.random().toString(16).slice(2,10),
      clean: true,
      reconnectPeriod: 3000,
      connectTimeout: 10000,
      protocolVersion: 4,
      keepalive: 60
    });

    client.on("connect", () => {
      setCloud(true, "CLOUD+");
      connectBtn.disabled = false;
      loginBox.classList.add("hidden");
      msgEl.textContent = "云端已连接，正在读取状态…";
      client.subscribe(STATUS_TOPIC, {qos:0}, err => {
        if(err) msgEl.textContent = "订阅失败：" + err.message;
        else publish("status");
      });
    });

    client.on("message", (topic, payload) => {
      if(topic !== STATUS_TOPIC) return;
      try{ render(JSON.parse(payload.toString())); }
      catch(e){ msgEl.textContent = "状态数据解析失败。"; }
    });

    client.on("reconnect", () => {
      setCloud(false, "重连中…");
      msgEl.textContent = "云端中断，正在自动重连…";
    });

    client.on("offline", () => {
      setCloud(false, "CLOUD-");
      msgEl.textContent = "当前无法连接云端。";
    });

    client.on("close", () => setCloud(false, "CLOUD-"));

    client.on("error", err => {
      setCloud(false, "连接失败");
      connectBtn.disabled = false;
      loginBox.classList.remove("hidden");
      msgEl.textContent = "连接失败，请检查 MQTT 密码和网络。";
      console.error(err);
    });
  }

  connectBtn.addEventListener("click", connectCloud);
  waterBtn.addEventListener("click", () => { if(confirm("确认执行一次浇水吗？")) publish("water"); });
  stopBtn.addEventListener("click", () => publish("stop"));
  autoBtn.addEventListener("click", () => { if(last) publish(last.auto ? "auto_off" : "auto_on"); });
  statusBtn.addEventListener("click", () => publish("status"));
  resetBtn.addEventListener("click", () => { if(confirm("TEST 模式：确认清零今日次数？")) publish("test_reset"); });
})();
</script>
</body>
</html>
