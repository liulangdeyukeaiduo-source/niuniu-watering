<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">浇花项目硬件结构示意</title>
  <desc id="desc">花盆、土壤湿度传感器、ESP32-S3、MOSFET、24V水泵、水箱、电源和水管的硬件连接示意。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfdfb"/>
      <stop offset="1" stop-color="#f4f8f4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="1">
      <stop offset="0" stop-color="#7bc8ee"/>
      <stop offset="1" stop-color="#4aa9db"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#84c96f"/>
      <stop offset="1" stop-color="#3f9654"/>
    </linearGradient>
    <linearGradient id="board" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#39423f"/>
      <stop offset="1" stop-color="#202725"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#33463a" flood-opacity=".12"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6a8f75"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
      .label{font-size:25px;font-weight:700;fill:#314139}
      .sub{font-size:18px;fill:#7b8a81}
      .wire{fill:none;stroke:#69756f;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:#6a8f75;stroke-width:7;stroke-linecap:round;marker-end:url(#arrow)}
      .water{fill:none;stroke:url(#water);stroke-width:18;stroke-linecap:round}
      .badge{fill:#e8f4e9;stroke:#cce5cf;stroke-width:2}
      .badgeText{font-size:18px;font-weight:700;fill:#2f773e}
      .card{fill:#ffffff;stroke:#e7ece8;stroke-width:2}
    </style>
  </defs>

  <rect x="8" y="8" width="1424" height="884" rx="34" fill="url(#bg)" stroke="#e8eee9" stroke-width="2"/>

  <g transform="translate(70 42)">
    <path d="M0 22 C24 -10 58 -13 79 8 C55 36 27 42 0 22Z" fill="url(#leaf)"/>
    <path d="M48 8 C48 25 44 39 34 54" fill="none" stroke="#408b50" stroke-width="4" stroke-linecap="round"/>
    <text x="102" y="28" class="label" style="font-size:34px">浇花项目硬件结构</text>
    <text x="104" y="62" class="sub">物理部件与连接关系示意 · 实时状态以下方状态卡为准</text>
  </g>

  <!-- water tube -->
  <path d="M1195 275 C1285 245 1330 190 1300 138 C1272 92 1110 100 940 100 L390 100 C320 100 282 124 260 174" class="water"/>
  <path d="M1195 275 C1285 245 1330 190 1300 138 C1272 92 1110 100 940 100 L390 100 C320 100 282 124 260 174" fill="none" stroke="#dff3fd" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(236 166) rotate(-18)">
    <rect x="0" y="0" width="76" height="28" rx="9" fill="#444d4a"/>
    <rect x="56" y="2" width="36" height="24" rx="7" fill="#c8d0cd"/>
    <circle cx="93" cy="14" r="7" fill="#6ebfe6"/>
  </g>
  <g fill="#64bce8" opacity=".8">
    <ellipse cx="219" cy="213" rx="7" ry="18" transform="rotate(28 219 213)"/>
    <ellipse cx="188" cy="235" rx="6" ry="15" transform="rotate(25 188 235)"/>
    <ellipse cx="239" cy="245" rx="5" ry="13" transform="rotate(34 239 245)"/>
  </g>

  <!-- plant -->
  <g transform="translate(70 260)" filter="url(#shadow)">
    <ellipse cx="165" cy="335" rx="135" ry="32" fill="#dfe7df"/>
    <path d="M55 205 C70 288 84 330 110 350 L220 350 C246 329 262 281 276 205Z" fill="#f1e5d8" stroke="#dfcdbd" stroke-width="4"/>
    <ellipse cx="165" cy="205" rx="112" ry="31" fill="#7e6044"/>
    <g stroke="#558b55" stroke-width="8" stroke-linecap="round">
      <path d="M164 203 C158 125 146 80 120 40"/>
      <path d="M166 198 C181 120 210 78 246 46"/>
      <path d="M158 196 C121 132 91 105 53 93"/>
      <path d="M168 195 C201 146 236 126 281 122"/>
      <path d="M164 190 C165 118 166 73 169 26"/>
    </g>
    <g fill="url(#leaf)">
      <ellipse cx="111" cy="58" rx="31" ry="60" transform="rotate(-38 111 58)"/>
      <ellipse cx="247" cy="62" rx="32" ry="63" transform="rotate(35 247 62)"/>
      <ellipse cx="57" cy="104" rx="34" ry="64" transform="rotate(-62 57 104)"/>
      <ellipse cx="284" cy="128" rx="33" ry="65" transform="rotate(70 284 128)"/>
      <ellipse cx="169" cy="35" rx="30" ry="64" transform="rotate(3 169 35)"/>
      <ellipse cx="116" cy="128" rx="27" ry="54" transform="rotate(-24 116 128)"/>
      <ellipse cx="215" cy="130" rx="27" ry="55" transform="rotate(26 215 130)"/>
    </g>
    <text x="165" y="397" text-anchor="middle" class="label">花盆与植物</text>
  </g>

  <!-- sensor -->
  <g transform="translate(315 310)">
    <path d="M0 40 C60 42 75 78 102 98" class="wire"/>
    <rect x="-8" y="0" width="52" height="86" rx="14" fill="#2f3835" filter="url(#shadow)"/>
    <rect x="5" y="17" width="26" height="23" rx="6" fill="#8cc877"/>
    <rect x="3" y="84" width="13" height="116" rx="5" fill="#bfc7c4"/>
    <rect x="26" y="84" width="13" height="116" rx="5" fill="#bfc7c4"/>
    <text x="26" y="232" text-anchor="middle" class="label">土壤传感器</text>
  </g>

  <!-- ESP32 -->
  <g transform="translate(505 285)" filter="url(#shadow)">
    <rect x="0" y="0" width="178" height="238" rx="20" fill="url(#board)" stroke="#141a18" stroke-width="4"/>
    <rect x="38" y="34" width="102" height="91" rx="10" fill="#d8dcda" stroke="#aeb5b1" stroke-width="3"/>
    <rect x="52" y="49" width="74" height="58" rx="8" fill="#b9c0bd"/>
    <path d="M66 80 Q89 57 112 80 M74 88 Q89 73 104 88 M86 96 Q89 93 92 96" fill="none" stroke="#6d7672" stroke-width="5" stroke-linecap="round"/>
    <g fill="#d7ad4b">
      <circle cx="17" cy="26" r="5"/><circle cx="17" cy="51" r="5"/><circle cx="17" cy="76" r="5"/><circle cx="17" cy="101" r="5"/><circle cx="17" cy="126" r="5"/><circle cx="17" cy="151" r="5"/><circle cx="17" cy="176" r="5"/><circle cx="17" cy="201" r="5"/>
      <circle cx="161" cy="26" r="5"/><circle cx="161" cy="51" r="5"/><circle cx="161" cy="76" r="5"/><circle cx="161" cy="101" r="5"/><circle cx="161" cy="126" r="5"/><circle cx="161" cy="151" r="5"/><circle cx="161" cy="176" r="5"/><circle cx="161" cy="201" r="5"/>
    </g>
    <rect x="63" y="190" width="52" height="40" rx="7" fill="#c9cdcb"/>
    <rect x="74" y="205" width="30" height="19" rx="4" fill="#747e79"/>
    <text x="89" y="267" text-anchor="middle" class="label">ESP32-S3</text>
  </g>

  <!-- MOSFET -->
  <g transform="translate(775 337)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="130" rx="18" fill="#498db6" stroke="#2d6f95" stroke-width="4"/>
    <rect x="44" y="21" width="66" height="68" rx="8" fill="#202725"/>
    <rect x="18" y="89" width="38" height="27" rx="5" fill="#82b768"/>
    <rect x="104" y="89" width="38" height="27" rx="5" fill="#82b768"/>
    <circle cx="18" cy="20" r="8" fill="#d7e0dd"/><circle cx="142" cy="20" r="8" fill="#d7e0dd"/>
    <text x="80" y="165" text-anchor="middle" class="label">MOSFET</text>
  </g>

  <!-- Pump -->
  <g transform="translate(1010 326)" filter="url(#shadow)">
    <rect x="42" y="30" width="185" height="104" rx="45" fill="#3f4744"/>
    <rect x="78" y="17" width="115" height="130" rx="31" fill="#555e5a"/>
    <rect x="0" y="52" width="58" height="38" rx="13" fill="#2b322f"/>
    <rect x="218" y="52" width="60" height="38" rx="13" fill="#2b322f"/>
    <rect x="83" y="137" width="32" height="18" rx="5" fill="#2d3431"/>
    <rect x="165" y="137" width="32" height="18" rx="5" fill="#2d3431"/>
    <text x="136" y="84" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">24V</text>
    <text x="136" y="114" text-anchor="middle" fill="#dce3df" font-size="19">自吸泵</text>
    <text x="136" y="190" text-anchor="middle" class="label">24V 自吸泵</text>
  </g>

  <!-- tank -->
  <g transform="translate(1195 380)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="270" rx="36" fill="#f7fbfc" stroke="#cfdcdd" stroke-width="4"/>
    <path d="M15 147 H155 V240 C155 253 145 263 132 263 H38 C25 263 15 253 15 240Z" fill="#82caec" opacity=".78"/>
    <rect x="14" y="-22" width="142" height="43" rx="17" fill="#414947"/>
    <path d="M34 95 H134 M34 160 H134 M34 225 H134" stroke="#9bb0b6" stroke-width="3" stroke-dasharray="12 10"/>
    <text x="85" y="310" text-anchor="middle" class="label">水箱</text>
  </g>

  <!-- flow arrows -->
  <path d="M420 408 H488" class="flow"/>
  <path d="M695 408 H756" class="flow"/>
  <path d="M948 408 H996" class="flow"/>

  <!-- power -->
  <g transform="translate(560 665)" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="116" rx="20" fill="#2e3532"/>
    <rect x="26" y="22" width="105" height="72" rx="11" fill="#414946"/>
    <circle cx="306" cy="34" r="9" fill="#6bd16f"/>
    <text x="79" y="57" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="800">24V</text>
    <text x="79" y="84" text-anchor="middle" fill="#dce2df" font-size="18">电源适配器</text>
    <text x="175" y="150" text-anchor="middle" class="label">24V 电源</text>
  </g>
  <path d="M625 665 V610 C625 572 596 560 596 535" class="wire"/>
  <path d="M735 665 V590 C735 560 854 552 854 485" class="wire"/>
  <path d="M838 665 V612 C838 565 1134 566 1134 520" class="wire"/>

  <!-- status badges -->
  <g transform="translate(84 806)">
    <rect width="220" height="48" rx="24" class="badge"/>
    <circle cx="30" cy="24" r="9" fill="#4fa65d"/>
    <text x="54" y="31" class="badgeText">传感器 → 主控</text>
  </g>
  <g transform="translate(326 806)">
    <rect width="220" height="48" rx="24" class="badge"/>
    <circle cx="30" cy="24" r="9" fill="#4fa65d"/>
    <text x="54" y="31" class="badgeText">主控 → MOSFET</text>
  </g>
  <g transform="translate(568 806)">
    <rect width="220" height="48" rx="24" class="badge"/>
    <circle cx="30" cy="24" r="9" fill="#4fa65d"/>
    <text x="54" y="31" class="badgeText">MOSFET → 水泵</text>
  </g>
  <g transform="translate(810 806)">
    <rect width="250" height="48" rx="24" class="badge"/>
    <circle cx="30" cy="24" r="9" fill="#4fa65d"/>
    <text x="54" y="31" class="badgeText">水箱 → 水泵 → 喷头</text>
  </g>
  <g transform="translate(1082 806)">
    <rect width="260" height="48" rx="24" fill="#f0f2f0" stroke="#e0e5e1" stroke-width="2"/>
    <circle cx="30" cy="24" r="9" fill="#9ba49e"/>
    <text x="54" y="31" font-size="18" font-weight="700" fill="#717b74">电源 / 水路未独立监测</text>
  </g>
</svg>